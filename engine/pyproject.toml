[project]
name = "lacre-engine"
version = "0.2.2"
description = "Lacre (Seal Check) engine: read-only used-iPhone checks over USB, JSON Lines protocol"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["pymobiledevice3==11.50.2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lacre_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
