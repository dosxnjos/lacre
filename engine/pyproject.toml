[project]
name = "lacre-engine"
version = "0.2.3"
description = "Lacre (Seal Check) engine: read-only used-iPhone checks over USB, JSON Lines protocol"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["pymobiledevice3==11.50.2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# cryptography 49 and newer ship no Intel macOS wheel (only macosx_11_0_arm64). Without this the Intel
# Mac build would compile it from source against the runner's OpenSSL (built for the runner's macOS) and
# the app would not start on older Macs. 48.0.1 is the last release with a macosx_10_9_universal2 wheel
# and satisfies pymobiledevice3 11.50.2 (cryptography>=43.0.0). Every other platform keeps the locked
# newer version. CI installs it with --no-build-package cryptography, so a missing wheel fails the build.
constraint-dependencies = [
    "cryptography==48.0.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lacre_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
