[package]
name = "lacre"
version = "0.2.1"
description = "Lacre (Seal Check): check a used iPhone before you buy it"
authors = ["dosxnjos"]
license = "MIT"
repository = "https://github.com/dosxnjos/lacre"
edition = "2021"
rust-version = "1.90"

[lib]
name = "lacre_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
